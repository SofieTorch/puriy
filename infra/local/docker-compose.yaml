name: cbba_mobility
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
    depends_on:
      - tempo
      - loki

  tempo:
    # latest uses kafka and there is no reliable way to disable it yet
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo

  loki:
    image: grafana/loki:latest
    volumes:
      - loki_data:/loki

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    depends_on:
      - tempo
      - loki
      - prometheus

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    ports:
      - "8002:8002"
    volumes:
      - valhalla_data:/custom_files
    environment:
      tile_urls: https://download.geofabrik.de/south-america/bolivia-latest.osm.pbf
      serve_tiles: "True"
      build_elevation: "False"
      build_admins: "False"
      build_time_zones: "False"

  nominatim:
    image: mediagis/nominatim:4.4
    ports:
      - "8004:8080"
    environment:
      PBF_URL: https://download.geofabrik.de/south-america/bolivia-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/south-america/bolivia-updates/
      NOMINATIM_PASSWORD: nominatim
      IMPORT_STYLE: full
    volumes:
      - nominatim_data:/var/lib/postgresql/14/main
    shm_size: 1g

  tileserver:
    # Serves vector tiles from Protomaps' free planet basemap.
    # Tiles are streamed on demand (no large download needed).
    # Cache is stored in the volume for faster subsequent loads.
    image: protomaps/go-pmtiles:latest
    ports:
      - "8003:8080"
    volumes:
      - tileserver_cache:/tmp/pmtiles
    command:
      - serve
      - /tmp/pmtiles
      - --bucket=https://build.protomaps.com/20250305.pmtiles
      - --port=8080

volumes:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
  valhalla_data:
  nominatim_data:
  tileserver_cache: