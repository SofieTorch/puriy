receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317  # listens for our app

exporters:
  otlp/tempo:
    endpoint: tempo:4317         # forwards traces to Tempo container
    tls:
      insecure: true
  loki:
    endpoint: http://loki:3100   # forwards logs to Loki container
  prometheus:
    endpoint: 0.0.0.0:8889       # exposes metrics for Prometheus to scrape

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      exporters: [loki]
    metrics:
      receivers: [otlp]
      exporters: [prometheus]