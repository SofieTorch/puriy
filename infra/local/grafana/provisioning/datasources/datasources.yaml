apiVersion: 1
datasources:
  - name: Tempo
    type: tempo
    url: http://tempo:3200
    isDefault: false

  - name: Loki
    type: loki
    url: http://loki:3100
    isDefault: false

  - name: Prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
```

So the final local folder looks like:
```
infra/local/
├── docker-compose.yml
├── otel-collector.yaml
├── tempo.yaml
├── prometheus.yml
└── grafana/
    └── provisioning/
        └── datasources/
            └── datasources.yaml