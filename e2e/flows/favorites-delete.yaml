appId: com.cbba.mobility
---
- launchApp:
    permissions:
      location: always
- setLocation:
    latitude: -17.394
    longitude: -66.182
- waitForAnimationToEnd
- waitForAnimationToEnd

# First, save a route so we have something to delete

# Search for a route
- tapOn:
    id: "explore-dest-input"
- inputText: "Lanza Cochabamba"
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

- hideKeyboard
- waitForAnimationToEnd

- tapOn: "Calle Leonardo Lanza"
- waitForAnimationToEnd

- tapOn:
    id: "explore-search-btn"
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

- assertVisible:
    id: "explore-results-title"

# Tap first route
- tapOn:
    text: "min"
    index: 0
- waitForAnimationToEnd
- waitForAnimationToEnd

# Save as commute
- tapOn:
    id: "explore-save-btn"
- waitForAnimationToEnd
- tapOn: "Viaje recurrente"
- waitForAnimationToEnd
- tapOn: "OK"
- waitForAnimationToEnd

# Go to Favorites tab
- tapOn: "Favoritos, tab.*"
- waitForAnimationToEnd
- waitForAnimationToEnd

# Verify trip is saved
- assertVisible:
    id: "favorites-commute-title"

# Tap trash icon on first trip card
- tapOn:
    id: "favorites-delete-0"
- waitForAnimationToEnd

# Confirm deletion
- tapOn: "Eliminar"
- waitForAnimationToEnd
- waitForAnimationToEnd

# Verify empty state
- assertVisible:
    id: "favorites-empty"

- takeScreenshot: "favorites-deleted"
