appId: com.cbba.mobility
---
- launchApp:
    permissions:
      location: always
- setLocation:
    latitude: -17.394
    longitude: -66.182
- waitForAnimationToEnd
- waitForAnimationToEnd

# Search for a route
- tapOn:
    id: "explore-dest-input"
- inputText: "Lanza Cochabamba"
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

- hideKeyboard
- waitForAnimationToEnd

- tapOn: "Calle Leonardo Lanza"
- waitForAnimationToEnd

# Search
- tapOn:
    id: "explore-search-btn"
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

# Verify results
- assertVisible:
    id: "explore-results-title"

# Tap first route
- tapOn:
    text: "min"
    index: 0
- waitForAnimationToEnd
- waitForAnimationToEnd

# Save as favorite
- tapOn:
    id: "explore-save-btn"
- waitForAnimationToEnd

# Select "Viaje recurrente" from alert
- tapOn: "Viaje recurrente"
- waitForAnimationToEnd

# Dismiss "Ruta guardada" alert
- tapOn: "OK"
- waitForAnimationToEnd

# Navigate to Favorites tab
- tapOn: "Favoritos, tab.*"
- waitForAnimationToEnd
- waitForAnimationToEnd

# Verify saved trip appears under Recurrentes
- assertVisible:
    id: "favorites-commute-title"

- takeScreenshot: "favorites-save-and-view"
