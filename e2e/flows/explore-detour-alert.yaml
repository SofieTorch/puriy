appId: com.cbba.mobility
---
- launchApp:
    permissions:
      location: always
- setLocation:
    latitude: -17.394
    longitude: -66.182
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

# Verify detour badge on nearby line card
- assertVisible:
    id: "explore-nearby-title"
- assertVisible: "Desvío"

# Tap into Line 250 detail
- tapOn: "250 Ecologica"
- waitForAnimationToEnd
- waitForAnimationToEnd

# Verify line detail shows detour info
- assertVisible: "Línea 250 Ecologica"
- assertVisible: "Desvío"

- takeScreenshot: "explore-detour-alert"
