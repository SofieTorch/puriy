appId: com.cbba.mobility
---
- launchApp:
    permissions:
      location: always
- setLocation:
    latitude: -17.394
    longitude: -66.182
- waitForAnimationToEnd

# Navigate to Record tab
- tapOn: "Trazar, tab.*"
- waitForAnimationToEnd
- waitForAnimationToEnd

# Start recording (swipe right on switch at bottom)
- swipe:
    start: "15%, 82%"
    end: "85%, 82%"
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

# Stop recording (swipe left)
- swipe:
    start: "85%, 82%"
    end: "15%, 82%"
- waitForAnimationToEnd
- waitForAnimationToEnd

# Verify save modal
- assertVisible: "Guardar recorrido"

# Select line
- tapOn:
    id: "modal-line-dropdown"
- waitForAnimationToEnd
- tapOn: "250 Ecologica"
- waitForAnimationToEnd
- waitForAnimationToEnd

# Dismiss the active detour prompt (Line 250 has an active detour)
# Tap "No, ya no" to dismiss the prompt and reveal the detour toggle
- tapOn: "No, ya no"
- waitForAnimationToEnd

# Scroll to detour toggle and enable it
- scrollUntilVisible:
    element:
      text: "Es un desvío"
    direction: "DOWN"
- tapOn: "Es un desvío"
- waitForAnimationToEnd

# Verify reason buttons appear
- assertVisible: "Construcción"
- tapOn: "Construcción"

# Tap save (now shows "Revisar desvío")
- tapOn:
    id: "modal-save-btn"
- waitForAnimationToEnd
- waitForAnimationToEnd

# Verify detour confirmation screen
- assertVisible:
    id: "modal-detour-confirm-title"
- assertVisible: "Ruta normal"
- assertVisible: "Publicar desvío"

- takeScreenshot: "record-detour-confirmation"
