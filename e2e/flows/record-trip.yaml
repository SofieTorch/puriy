appId: com.cbba.mobility
---
- launchApp:
    permissions:
      location: always
- setLocation:
    latitude: -17.394
    longitude: -66.182
- waitForAnimationToEnd

# Navigate to Record tab
- tapOn: "Trazar, tab.*"
- waitForAnimationToEnd
- waitForAnimationToEnd

# Verify initial state
- assertVisible: "Desliza para empezar"

# Start recording (swipe right on switch at bottom)
- swipe:
    start: "15%, 82%"
    end: "85%, 82%"
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

# Verify recording state
- assertVisible: "Grabando..."

# Stop recording (swipe left)
- swipe:
    start: "85%, 82%"
    end: "15%, 82%"
- waitForAnimationToEnd
- waitForAnimationToEnd

# Verify save modal
- assertVisible:
    id: "modal-title"

# Select line
- tapOn:
    id: "modal-line-dropdown"
- waitForAnimationToEnd
- tapOn: "250 Ecologica"
- waitForAnimationToEnd

# Save
- tapOn:
    id: "modal-save-btn"
- waitForAnimationToEnd
- waitForAnimationToEnd

- takeScreenshot: "record-trip-saved"
