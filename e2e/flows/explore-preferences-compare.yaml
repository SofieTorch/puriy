- waitForAnimationToEnd

# Verify all preferences sheet contents
- assertVisible:
    id: "prefs-title"
- assertVisible:
    id: "prefs-pending-lines"
- assertVisible: "Incluir rutas pendientes"

- takeScreenshot: "explore-preferences-sheet"
