[project]
name = "pipeline"
version = "0.1.0"
description = "Pipeline orchestration for transit route reconstruction"
requires-python = ">=3.14"
dependencies = [
  "database>=0.1.0",
  "geodata>=0.1.0",
  "routebuilder>=0.1.0",
  "sqlalchemy>=2.0.48",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
database = {path = "../database", editable = true}
geodata = {path = "../geodata", editable = true}
routebuilder = {path = "../routebuilder", editable = true}

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
