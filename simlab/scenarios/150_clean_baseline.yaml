name: 150_clean_baseline
description: >
  Line 150 with low-noise full trips: the sanity baseline every change
  to the reconstruction engine should keep passing.
routes:
  - name: main
    path: transit-lab/seed/routes/150_blanco_galindo_cuatro_esquinas.geojson
    role: main
seed: 7
sim_days: 14
vote_day: 14
personas:
  - name: surveyor
    traces: 12
    voters: 3            # 3 regulars (3 full-zone traces each) → confirm the route
    travel_window: [0.0, 1.0]
    noise_multiplier: 0.5
    fare_report_prob: 0.5
    sampling_rate_s: 2.0
noise:
  gaussian_sigma_m: 2.0
  perpendicular_sigma_m: 1.5
  jump_probability: 0.0
  jump_distance_m: 0.0
  missing_probability: 0.01
  timestamp_jitter_s: 0.1
