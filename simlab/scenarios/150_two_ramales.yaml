name: 150_two_ramales
description: >
  Line 150 with two real ramales as separate base routes (two recorded
  variants of the line), one rider group each. Expected outcome: one
  reconstructed route per ramal, each confirmed by its own riders.
seed: 23
sim_days: 21
vote_day: 21
routes:
  - name: directo
    path: transit-lab/seed/routes/150_blanco_galindo_cuatro_esquinas.geojson
    role: main
  - name: via_parallel
    path: transit-lab/seed/routes/150_beijing_victor_ustariz.geojson
    role: ramal
personas:
  - name: directo_riders
    count: 3
    route: directo
    trips_per_week: 5.0
    partial_trip_prob: 0.2
    travel_window: [0.0, 1.0]
    min_trip_fraction: 0.6
    vote_propensity: 0.9
    fare_report_prob: 0.2
    sampling_rate_s: 2.0
    fare_areas:
      - {name: centro, start_fraction: 0.0, end_fraction: 0.6, amount_bob: 2.4}
      - {name: periferia, start_fraction: 0.6, end_fraction: 1.0, amount_bob: 3.0}
  - name: parallel_riders
    count: 3
    route: via_parallel
    trips_per_week: 5.0
    partial_trip_prob: 0.2
    travel_window: [0.0, 1.0]
    min_trip_fraction: 0.6
    vote_propensity: 0.9
    fare_report_prob: 0.2
    sampling_rate_s: 2.0
    fare_areas:
      - {name: centro, start_fraction: 0.0, end_fraction: 0.6, amount_bob: 2.4}
      - {name: periferia, start_fraction: 0.6, end_fraction: 1.0, amount_bob: 3.0}
noise:
  gaussian_sigma_m: 3.0
  perpendicular_sigma_m: 2.0
  jump_probability: 0.01
  jump_distance_m: 30.0
  missing_probability: 0.02
  timestamp_jitter_s: 0.15
