<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1120" width="820" height="1120" font-family="'Latin Modern Roman','Georgia','Times New Roman',serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .title { font-size:17px; font-weight:bold; fill:#1a1a1a; }
      .step  { font-size:14px; font-weight:bold; fill:#1a1a1a; }
      .subh  { font-size:13px; font-weight:bold; fill:#333; }
      .subt  { font-size:12px; fill:#555; font-style:italic; }
      .sub   { font-size:11px; fill:#666; font-style:italic; }
      .lbl   { font-size:12.5px; fill:#2b2b2b; }
      .rlbl  { font-size:12px; fill:#444; font-style:italic; }
      .red   { fill:#c0392b; }
      .box   { fill:#fcfbf8; stroke:#d8d3c6; stroke-width:1.3; }
      .div   { stroke:#e2ddd0; stroke-width:1.2; }
      .edge  { stroke:#444; stroke-width:1.4; fill:none; }
      .flow  { stroke:#9a9a9a; stroke-width:1.4; fill:none; }
      .chip  { font-size:16px; font-weight:bold; }
      .chipS { font-size:14px; font-weight:bold; }
    </style>
  </defs>

  <text class="title" text-anchor="middle" x="410" y="28">Estrategia de ensamblaje por solapamiento de aristas</text>

  <!-- ===================== STEP 1 ===================== -->
  <text class="step" x="40" y="58">1. De traza GPS a secuencia de aristas dirigidas</text>
  <g transform="translate(80,0)">
    <text class="sub" x="44" y="86">traza GPS (puntos)</text>
    <path class="edge" stroke="#999" stroke-dasharray="4 3" d="M150,108 L190,96 L235,108 L280,92 L330,108 L380,98 L430,110 L475,96"/>
    <g fill="#888">
      <circle cx="150" cy="108" r="3"/><circle cx="190" cy="96" r="3"/><circle cx="235" cy="108" r="3"/>
      <circle cx="280" cy="92" r="3"/><circle cx="330" cy="108" r="3"/><circle cx="380" cy="98" r="3"/>
      <circle cx="430" cy="110" r="3"/><circle cx="475" cy="96" r="3"/>
    </g>
    <path class="edge" d="M310,124 L310,156" marker-end="url(#arrow)"/>
    <text class="sub" x="320" y="146">map-matching (HMM, Valhalla)</text>
    <g>
      <rect x="137" y="160" width="46" height="30" rx="6" fill="#f6e3dd" stroke="#b5462f" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="160" y="181" fill="#b5462f">A</text>
      <rect x="195" y="160" width="46" height="30" rx="6" fill="#f7ecd9" stroke="#c8862b" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="218" y="181" fill="#c8862b">B</text>
      <rect x="253" y="160" width="46" height="30" rx="6" fill="#dcefe3" stroke="#2e8b57" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="276" y="181" fill="#2e8b57">C</text>
      <rect x="311" y="160" width="46" height="30" rx="6" fill="#dde9f5" stroke="#2f6fb0" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="334" y="181" fill="#2f6fb0">D</text>
    </g>
    <text class="sub" text-anchor="middle" x="247" y="208">secuencia de aristas dirigidas (id : sentido)</text>
  </g>
  <path class="flow" d="M327,212 L327,242" marker-end="url(#arrow)"/>

  <!-- ===================== STEP 2 ===================== -->
  <text class="step" x="40" y="252">2. Filtrado de ruido (antes de ensamblar)</text>
  <text class="subt" x="44" y="272">soporte de una arista o par = nº de trazas que lo contienen  (umbral por defecto ≈ 34 % de las trazas)</text>

  <!-- (a) low-support edge -->
  <g transform="translate(0,212)">
    <text class="subh" x="34" y="86">a)  Arista de bajo soporte (ruido)</text>
    <rect class="box" x="30" y="96" width="760" height="150" rx="9"/>
    <text class="rlbl" x="44" y="135">t1</text>
    <text class="rlbl" x="44" y="167">t2</text>
    <text class="rlbl" x="44" y="201">t3</text>
    <!-- t1: D E -->
    <rect x="72" y="118" width="36" height="26" rx="6" fill="#dde9f5" stroke="#2f6fb0" stroke-width="1.5"/><text class="chipS" text-anchor="middle" x="90" y="136" fill="#2f6fb0">D</text>
    <path class="edge" d="M108,131 L120,131" marker-end="url(#arrow)"/>
    <rect x="122" y="118" width="36" height="26" rx="6" fill="#e7e0f1" stroke="#6f4fa3" stroke-width="1.5"/><text class="chipS" text-anchor="middle" x="140" y="136" fill="#6f4fa3">E</text>
    <!-- t2: D E -->
    <rect x="72" y="150" width="36" height="26" rx="6" fill="#dde9f5" stroke="#2f6fb0" stroke-width="1.5"/><text class="chipS" text-anchor="middle" x="90" y="168" fill="#2f6fb0">D</text>
    <path class="edge" d="M108,163 L120,163" marker-end="url(#arrow)"/>
    <rect x="122" y="150" width="36" height="26" rx="6" fill="#e7e0f1" stroke="#6f4fa3" stroke-width="1.5"/><text class="chipS" text-anchor="middle" x="140" y="168" fill="#6f4fa3">E</text>
    <!-- t3: D X E (X = noise) -->
    <rect x="72" y="184" width="36" height="26" rx="6" fill="#dde9f5" stroke="#2f6fb0" stroke-width="1.5"/><text class="chipS" text-anchor="middle" x="90" y="202" fill="#2f6fb0">D</text>
    <path class="edge" d="M108,197 L120,197" marker-end="url(#arrow)"/>
    <rect x="122" y="184" width="36" height="26" rx="6" fill="#efeaea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 2.5"/><text class="chipS" text-anchor="middle" x="140" y="202" fill="#c0392b">X</text>
    <path class="edge" d="M158,197 L170,197" marker-end="url(#arrow)"/>
    <rect x="172" y="184" width="36" height="26" rx="6" fill="#e7e0f1" stroke="#6f4fa3" stroke-width="1.5"/><text class="chipS" text-anchor="middle" x="190" y="202" fill="#6f4fa3">E</text>

    <line class="div" x1="232" y1="110" x2="232" y2="232"/>
    <text class="lbl" x="252" y="130">soporte(D → E) = 2</text>
    <text class="lbl" x="252" y="154">soporte(D → X) = 1</text>
    <text class="lbl" x="252" y="178">soporte(X → E) = 1</text>
    <text class="lbl red" x="252" y="206" font-weight="bold">soporte(X) = 1  ≤  umbral</text>

    <line class="div" x1="470" y1="110" x2="470" y2="232"/>
    <path class="edge" d="M486,171 L520,171" marker-end="url(#arrow)"/>
    <text class="sub" text-anchor="middle" x="503" y="163">eliminar X</text>
    <text class="lbl" x="538" y="146">traza limpia:</text>
    <rect x="612" y="158" width="36" height="26" rx="6" fill="#dde9f5" stroke="#2f6fb0" stroke-width="1.5"/><text class="chipS" text-anchor="middle" x="630" y="176" fill="#2f6fb0">D</text>
    <path class="edge" d="M648,171 L660,171" marker-end="url(#arrow)"/>
    <rect x="662" y="158" width="36" height="26" rx="6" fill="#e7e0f1" stroke="#6f4fa3" stroke-width="1.5"/><text class="chipS" text-anchor="middle" x="680" y="176" fill="#6f4fa3">E</text>
    <text class="sub" x="538" y="216">una arista interna poco frecuente, puenteada por</text>
    <text class="sub" x="538" y="230">un par más frecuente, se descarta como ruido.</text>
  </g>

  <!-- (b) isolated trace -->
  <g transform="translate(0,188)">
    <text class="subh" x="34" y="296">b)  Traza aislada o errónea (sin solape)</text>
    <rect class="box" x="30" y="306" width="760" height="124" rx="9"/>
    <text class="rlbl" x="44" y="345">t1</text>
    <text class="rlbl" x="44" y="377">t2</text>
    <text class="rlbl" x="40" y="409">t_m</text>
    <!-- t1: A B C -->
    <rect x="74" y="330" width="34" height="24" rx="6" fill="#f6e3dd" stroke="#b5462f" stroke-width="1.5"/><text class="chipS" text-anchor="middle" x="91" y="347" fill="#b5462f">A</text>
    <rect x="112" y="330" width="34" height="24" rx="6" fill="#f7ecd9" stroke="#c8862b" stroke-width="1.5"/><text class="chipS" text-anchor="middle" x="129" y="347" fill="#c8862b">B</text>
    <rect x="150" y="330" width="34" height="24" rx="6" fill="#dcefe3" stroke="#2e8b57" stroke-width="1.5"/><text class="chipS" text-anchor="middle" x="167" y="347" fill="#2e8b57">C</text>
    <!-- t2: B C D -->
    <rect x="112" y="362" width="34" height="24" rx="6" fill="#f7ecd9" stroke="#c8862b" stroke-width="1.5"/><text class="chipS" text-anchor="middle" x="129" y="379" fill="#c8862b">B</text>
    <rect x="150" y="362" width="34" height="24" rx="6" fill="#dcefe3" stroke="#2e8b57" stroke-width="1.5"/><text class="chipS" text-anchor="middle" x="167" y="379" fill="#2e8b57">C</text>
    <rect x="188" y="362" width="34" height="24" rx="6" fill="#dde9f5" stroke="#2f6fb0" stroke-width="1.5"/><text class="chipS" text-anchor="middle" x="205" y="379" fill="#2f6fb0">D</text>
    <!-- t_m: P Q R (disjoint, struck) -->
    <rect x="74" y="394" width="34" height="24" rx="6" fill="#efefec" stroke="#8a8a8a" stroke-width="1.5"/><text class="chipS" text-anchor="middle" x="91" y="411" fill="#777">P</text>
    <rect x="112" y="394" width="34" height="24" rx="6" fill="#efefec" stroke="#8a8a8a" stroke-width="1.5"/><text class="chipS" text-anchor="middle" x="129" y="411" fill="#777">Q</text>
    <rect x="150" y="394" width="34" height="24" rx="6" fill="#efefec" stroke="#8a8a8a" stroke-width="1.5"/><text class="chipS" text-anchor="middle" x="167" y="411" fill="#777">R</text>
    <line x1="68" y1="406" x2="190" y2="406" stroke="#c0392b" stroke-width="1.8"/>

    <line class="div" x1="250" y1="320" x2="250" y2="416"/>
    <text class="lbl" x="272" y="352">t1 y t2 comparten aristas (B, C)  →  se conservan</text>
    <text class="lbl" x="272" y="388">t_m no comparte ninguna arista con las demás</text>
    <text class="lbl red" x="272" y="412" font-weight="bold">⇒ se descarta (no entra al ensamblaje)</text>
  </g>
  <path class="flow" d="M410,622 L410,646" marker-end="url(#arrow)"/>

  <!-- ===================== STEP 3 ===================== -->
  <text class="step" x="40" y="648">3. Solapamiento y ensamblaje de varias trazas</text>
  <g transform="translate(80,396)">
    <rect x="189" y="278" width="348" height="170" rx="6" fill="#eef3f7"/>
    <text class="sub" text-anchor="middle" x="363" y="272">columnas alineadas = misma arista</text>
    <text class="rlbl" x="96" y="305">t1</text>
    <text class="rlbl" x="96" y="345">t2</text>
    <text class="rlbl" x="96" y="385">t3</text>
    <text class="rlbl" x="96" y="425">t4</text>
    <!-- t1: A B C D -->
    <rect x="137" y="285" width="46" height="30" rx="6" fill="#f6e3dd" stroke="#b5462f" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="160" y="306" fill="#b5462f">A</text>
    <rect x="195" y="285" width="46" height="30" rx="6" fill="#f7ecd9" stroke="#c8862b" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="218" y="306" fill="#c8862b">B</text>
    <rect x="253" y="285" width="46" height="30" rx="6" fill="#dcefe3" stroke="#2e8b57" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="276" y="306" fill="#2e8b57">C</text>
    <rect x="311" y="285" width="46" height="30" rx="6" fill="#dde9f5" stroke="#2f6fb0" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="334" y="306" fill="#2f6fb0">D</text>
    <!-- t2: C D E F -->
    <rect x="253" y="325" width="46" height="30" rx="6" fill="#dcefe3" stroke="#2e8b57" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="276" y="346" fill="#2e8b57">C</text>
    <rect x="311" y="325" width="46" height="30" rx="6" fill="#dde9f5" stroke="#2f6fb0" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="334" y="346" fill="#2f6fb0">D</text>
    <rect x="369" y="325" width="46" height="30" rx="6" fill="#e7e0f1" stroke="#6f4fa3" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="392" y="346" fill="#6f4fa3">E</text>
    <rect x="427" y="325" width="46" height="30" rx="6" fill="#f4dee7" stroke="#b04f78" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="450" y="346" fill="#b04f78">F</text>
    <!-- t3: D E F G -->
    <rect x="311" y="365" width="46" height="30" rx="6" fill="#dde9f5" stroke="#2f6fb0" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="334" y="386" fill="#2f6fb0">D</text>
    <rect x="369" y="365" width="46" height="30" rx="6" fill="#e7e0f1" stroke="#6f4fa3" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="392" y="386" fill="#6f4fa3">E</text>
    <rect x="427" y="365" width="46" height="30" rx="6" fill="#f4dee7" stroke="#b04f78" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="450" y="386" fill="#b04f78">F</text>
    <rect x="485" y="365" width="46" height="30" rx="6" fill="#dcebe9" stroke="#3f7d7a" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="508" y="386" fill="#3f7d7a">G</text>
    <!-- t4: B C D contained -->
    <rect x="195" y="405" width="46" height="30" rx="6" fill="#f7ecd9" stroke="#c8862b" stroke-width="1.6" stroke-dasharray="4 2.5"/><text class="chip" text-anchor="middle" x="218" y="426" fill="#c8862b">B</text>
    <rect x="253" y="405" width="46" height="30" rx="6" fill="#dcefe3" stroke="#2e8b57" stroke-width="1.6" stroke-dasharray="4 2.5"/><text class="chip" text-anchor="middle" x="276" y="426" fill="#2e8b57">C</text>
    <rect x="311" y="405" width="46" height="30" rx="6" fill="#dde9f5" stroke="#2f6fb0" stroke-width="1.6" stroke-dasharray="4 2.5"/><text class="chip" text-anchor="middle" x="334" y="426" fill="#2f6fb0">D</text>
    <text class="sub" x="548" y="425">contenida → se absorbe</text>
    <path class="edge" d="M363,476 L363,506" marker-end="url(#arrow)"/>
    <text class="sub" x="373" y="496">ensamblar (solape sufijo–prefijo; respaldo: beam search)</text>
  </g>

  <!-- ===================== STEP 4 ===================== -->
  <text class="step" x="40" y="940">4. Contig consenso</text>
  <g transform="translate(80,396)">
    <rect x="129" y="556" width="416" height="42" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="137" y="562" width="46" height="30" rx="6" fill="#f6e3dd" stroke="#b5462f" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="160" y="583" fill="#b5462f">A</text>
    <rect x="195" y="562" width="46" height="30" rx="6" fill="#f7ecd9" stroke="#c8862b" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="218" y="583" fill="#c8862b">B</text>
    <rect x="253" y="562" width="46" height="30" rx="6" fill="#dcefe3" stroke="#2e8b57" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="276" y="583" fill="#2e8b57">C</text>
    <rect x="311" y="562" width="46" height="30" rx="6" fill="#dde9f5" stroke="#2f6fb0" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="334" y="583" fill="#2f6fb0">D</text>
    <rect x="369" y="562" width="46" height="30" rx="6" fill="#e7e0f1" stroke="#6f4fa3" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="392" y="583" fill="#6f4fa3">E</text>
    <rect x="427" y="562" width="46" height="30" rx="6" fill="#f4dee7" stroke="#b04f78" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="450" y="583" fill="#b04f78">F</text>
    <rect x="485" y="562" width="46" height="30" rx="6" fill="#dcebe9" stroke="#3f7d7a" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="508" y="583" fill="#3f7d7a">G</text>
    <path class="edge" d="M337,598 L337,632" marker-end="url(#arrow)"/>
  </g>

  <!-- ===================== STEP 5 ===================== -->
  <text class="step" x="40" y="1044">5. Geometría cosida de la ruta</text>
  <g transform="translate(80,396)">
    <g stroke-width="4" stroke-linecap="round" fill="none">
      <line x1="160" y1="700" x2="218" y2="684" stroke="#b5462f"/>
      <line x1="218" y1="684" x2="278" y2="694" stroke="#c8862b"/>
      <line x1="278" y1="694" x2="338" y2="672" stroke="#2e8b57"/>
      <line x1="338" y1="672" x2="398" y2="690" stroke="#2f6fb0"/>
      <line x1="398" y1="690" x2="455" y2="676" stroke="#6f4fa3"/>
      <line x1="455" y1="676" x2="512" y2="696" stroke="#b04f78"/>
      <line x1="512" y1="696" x2="560" y2="680" stroke="#3f7d7a"/>
    </g>
    <g fill="#fff" stroke="#555" stroke-width="1.2">
      <circle cx="160" cy="700" r="3.5"/><circle cx="560" cy="680" r="3.5"/>
    </g>
    <text class="sub" x="572" y="690">ruta</text>
  </g>
</svg>
