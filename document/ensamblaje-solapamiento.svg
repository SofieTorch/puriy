<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 740" width="760" height="740" font-family="'Latin Modern Roman','Georgia','Times New Roman',serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .title { font-size:17px; font-weight:bold; fill:#1a1a1a; }
      .step  { font-size:13.5px; font-weight:bold; fill:#1a1a1a; }
      .lbl   { font-size:12px; fill:#333; }
      .sub   { font-size:11px; fill:#666; font-style:italic; }
      .rlbl  { font-size:12px; fill:#444; font-style:italic; }
      .edge  { stroke:#444; stroke-width:1.4; fill:none; }
      .chip  { font-size:16px; font-weight:bold; }
    </style>
  </defs>

  <text class="title" text-anchor="middle" x="380" y="28">Ensamblaje por solapamiento de aristas</text>

  <!-- ============ Panel 1: map-matching ============ -->
  <text class="step" x="40" y="58">1. De traza GPS a secuencia de aristas dirigidas</text>
  <text class="sub" x="44" y="86">traza GPS (puntos)</text>
  <!-- gps polyline + dots -->
  <path class="edge" stroke="#999" stroke-dasharray="4 3" d="M150,108 L190,96 L235,108 L280,92 L330,108 L380,98 L430,110 L475,96"/>
  <g fill="#888">
    <circle cx="150" cy="108" r="3"/><circle cx="190" cy="96" r="3"/><circle cx="235" cy="108" r="3"/>
    <circle cx="280" cy="92" r="3"/><circle cx="330" cy="108" r="3"/><circle cx="380" cy="98" r="3"/>
    <circle cx="430" cy="110" r="3"/><circle cx="475" cy="96" r="3"/>
  </g>
  <path class="edge" d="M310,124 L310,156" marker-end="url(#arrow)"/>
  <text class="sub" x="320" y="146">map-matching (HMM, Valhalla)</text>
  <!-- snapped edge chips A B C D -->
  <g>
    <rect x="137" y="160" width="46" height="30" rx="6" fill="#f6e3dd" stroke="#b5462f" stroke-width="1.6"/>
    <text class="chip" text-anchor="middle" x="160" y="181" fill="#b5462f">A</text>
    <rect x="195" y="160" width="46" height="30" rx="6" fill="#f7ecd9" stroke="#c8862b" stroke-width="1.6"/>
    <text class="chip" text-anchor="middle" x="218" y="181" fill="#c8862b">B</text>
    <rect x="253" y="160" width="46" height="30" rx="6" fill="#dcefe3" stroke="#2e8b57" stroke-width="1.6"/>
    <text class="chip" text-anchor="middle" x="276" y="181" fill="#2e8b57">C</text>
    <rect x="311" y="160" width="46" height="30" rx="6" fill="#dde9f5" stroke="#2f6fb0" stroke-width="1.6"/>
    <text class="chip" text-anchor="middle" x="334" y="181" fill="#2f6fb0">D</text>
  </g>
  <text class="sub" text-anchor="middle" x="247" y="208">secuencia de aristas dirigidas (id : sentido)</text>

  <!-- ============ Panel 2: overlap ============ -->
  <text class="step" x="40" y="252">2. Solapamiento y ensamblaje de varias trazas</text>
  <!-- alignment band -->
  <rect x="189" y="278" width="348" height="170" rx="6" fill="#eef3f7"/>
  <text class="sub" text-anchor="middle" x="363" y="272">columnas alineadas = misma arista</text>

  <!-- row labels -->
  <text class="rlbl" x="96" y="305">t1</text>
  <text class="rlbl" x="96" y="345">t2</text>
  <text class="rlbl" x="96" y="385">t3</text>
  <text class="rlbl" x="96" y="425">t4</text>

  <!-- t1: A B C D  (cols 0-3) -->
  <g>
    <rect x="137" y="285" width="46" height="30" rx="6" fill="#f6e3dd" stroke="#b5462f" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="160" y="306" fill="#b5462f">A</text>
    <rect x="195" y="285" width="46" height="30" rx="6" fill="#f7ecd9" stroke="#c8862b" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="218" y="306" fill="#c8862b">B</text>
    <rect x="253" y="285" width="46" height="30" rx="6" fill="#dcefe3" stroke="#2e8b57" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="276" y="306" fill="#2e8b57">C</text>
    <rect x="311" y="285" width="46" height="30" rx="6" fill="#dde9f5" stroke="#2f6fb0" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="334" y="306" fill="#2f6fb0">D</text>
  </g>
  <!-- t2: C D E F  (cols 2-5) -->
  <g>
    <rect x="253" y="325" width="46" height="30" rx="6" fill="#dcefe3" stroke="#2e8b57" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="276" y="346" fill="#2e8b57">C</text>
    <rect x="311" y="325" width="46" height="30" rx="6" fill="#dde9f5" stroke="#2f6fb0" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="334" y="346" fill="#2f6fb0">D</text>
    <rect x="369" y="325" width="46" height="30" rx="6" fill="#e7e0f1" stroke="#6f4fa3" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="392" y="346" fill="#6f4fa3">E</text>
    <rect x="427" y="325" width="46" height="30" rx="6" fill="#f4dee7" stroke="#b04f78" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="450" y="346" fill="#b04f78">F</text>
  </g>
  <!-- t3: D E F G  (cols 3-6) -->
  <g>
    <rect x="311" y="365" width="46" height="30" rx="6" fill="#dde9f5" stroke="#2f6fb0" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="334" y="386" fill="#2f6fb0">D</text>
    <rect x="369" y="365" width="46" height="30" rx="6" fill="#e7e0f1" stroke="#6f4fa3" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="392" y="386" fill="#6f4fa3">E</text>
    <rect x="427" y="365" width="46" height="30" rx="6" fill="#f4dee7" stroke="#b04f78" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="450" y="386" fill="#b04f78">F</text>
    <rect x="485" y="365" width="46" height="30" rx="6" fill="#dcebe9" stroke="#3f7d7a" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="508" y="386" fill="#3f7d7a">G</text>
  </g>
  <!-- t4: B C D contained (cols 1-3) -->
  <g>
    <rect x="195" y="405" width="46" height="30" rx="6" fill="#f7ecd9" stroke="#c8862b" stroke-width="1.6" stroke-dasharray="4 2.5"/><text class="chip" text-anchor="middle" x="218" y="426" fill="#c8862b">B</text>
    <rect x="253" y="405" width="46" height="30" rx="6" fill="#dcefe3" stroke="#2e8b57" stroke-width="1.6" stroke-dasharray="4 2.5"/><text class="chip" text-anchor="middle" x="276" y="426" fill="#2e8b57">C</text>
    <rect x="311" y="405" width="46" height="30" rx="6" fill="#dde9f5" stroke="#2f6fb0" stroke-width="1.6" stroke-dasharray="4 2.5"/><text class="chip" text-anchor="middle" x="334" y="426" fill="#2f6fb0">D</text>
  </g>
  <text class="sub" x="548" y="425">contenida → se absorbe</text>
  <text class="sub" x="44" y="466">El ruido y las trazas aisladas se filtran antes de este paso (véase la figura de filtrado de ruido).</text>

  <path class="edge" d="M363,476 L363,506" marker-end="url(#arrow)"/>
  <text class="sub" x="373" y="496">ensamblar (solape sufijo–prefijo; respaldo: beam search)</text>

  <!-- ============ Panel 3: consensus contig ============ -->
  <text class="step" x="40" y="544">3. Contig consenso</text>
  <rect x="129" y="556" width="416" height="42" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <g>
    <rect x="137" y="562" width="46" height="30" rx="6" fill="#f6e3dd" stroke="#b5462f" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="160" y="583" fill="#b5462f">A</text>
    <rect x="195" y="562" width="46" height="30" rx="6" fill="#f7ecd9" stroke="#c8862b" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="218" y="583" fill="#c8862b">B</text>
    <rect x="253" y="562" width="46" height="30" rx="6" fill="#dcefe3" stroke="#2e8b57" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="276" y="583" fill="#2e8b57">C</text>
    <rect x="311" y="562" width="46" height="30" rx="6" fill="#dde9f5" stroke="#2f6fb0" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="334" y="583" fill="#2f6fb0">D</text>
    <rect x="369" y="562" width="46" height="30" rx="6" fill="#e7e0f1" stroke="#6f4fa3" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="392" y="583" fill="#6f4fa3">E</text>
    <rect x="427" y="562" width="46" height="30" rx="6" fill="#f4dee7" stroke="#b04f78" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="450" y="583" fill="#b04f78">F</text>
    <rect x="485" y="562" width="46" height="30" rx="6" fill="#dcebe9" stroke="#3f7d7a" stroke-width="1.6"/><text class="chip" text-anchor="middle" x="508" y="583" fill="#3f7d7a">G</text>
  </g>

  <path class="edge" d="M337,602 L337,632" marker-end="url(#arrow)"/>

  <!-- ============ Panel 4: stitched geometry ============ -->
  <text class="step" x="40" y="648">4. Geometría cosida de la ruta</text>
  <g stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="160" y1="700" x2="218" y2="684" stroke="#b5462f"/>
    <line x1="218" y1="684" x2="278" y2="694" stroke="#c8862b"/>
    <line x1="278" y1="694" x2="338" y2="672" stroke="#2e8b57"/>
    <line x1="338" y1="672" x2="398" y2="690" stroke="#2f6fb0"/>
    <line x1="398" y1="690" x2="455" y2="676" stroke="#6f4fa3"/>
    <line x1="455" y1="676" x2="512" y2="696" stroke="#b04f78"/>
    <line x1="512" y1="696" x2="560" y2="680" stroke="#3f7d7a"/>
  </g>
  <g fill="#fff" stroke="#555" stroke-width="1.2">
    <circle cx="160" cy="700" r="3.5"/><circle cx="560" cy="680" r="3.5"/>
  </g>
  <text class="sub" x="572" y="690">ruta</text>
</svg>
