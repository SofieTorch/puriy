<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="860" viewBox="0 0 1180 860" font-family="Georgia, 'Times New Roman', Times, serif">
  <defs>
    <marker id="mArr" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#37474f"/>
    </marker>
    <marker id="mWalk" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#607d8b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="860" fill="#ffffff"/>
  <text x="40" y="48" font-size="23" font-weight="700" fill="#263238">Construcción del grafo de transporte</text>
  <text x="40" y="71" font-size="13.5" font-style="italic" fill="#607d8b">Paso a paso, desde los tramos recorridos de cada línea hasta el grafo navegable</text>

  <!-- ============ PANEL 1 ============ -->
  <g transform="translate(40,90)">
    <rect x="0.5" y="0.5" width="349" height="219" rx="9" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.2"/>
    <circle cx="26" cy="27" r="12" fill="none" stroke="#37474f" stroke-width="1.3"/>
    <text x="26" y="31.5" font-size="13" font-weight="700" fill="#37474f" text-anchor="middle">1</text>
    <text x="48" y="32" font-size="14" font-weight="700" fill="#37474f">Entrada: tramos de cada ruta</text>
    <rect x="16" y="46" width="318" height="150" rx="6" fill="#fafafa" stroke="#eceff1"/>
    <polyline points="40,100 95,82 150,96 205,84 258,108" fill="none" stroke="#37474f" stroke-width="3" stroke-linejoin="round"/>
    <polyline points="40,165 98,176 152,160 206,174 268,154" fill="none" stroke="#90a4ae" stroke-width="3" stroke-linejoin="round"/>
    <g fill="#37474f"><circle cx="40" cy="100" r="3"/><circle cx="95" cy="82" r="3"/><circle cx="150" cy="96" r="3"/><circle cx="205" cy="84" r="3"/><circle cx="258" cy="108" r="3"/></g>
    <g fill="#90a4ae"><circle cx="40" cy="165" r="3"/><circle cx="98" cy="176" r="3"/><circle cx="152" cy="160" r="3"/><circle cx="206" cy="174" r="3"/><circle cx="268" cy="154" r="3"/></g>
    <text x="175" y="212" font-size="11" font-style="italic" fill="#607d8b" text-anchor="middle">cada línea llega como una secuencia de tramos</text>
  </g>

  <!-- ============ PANEL 2 ============ -->
  <g transform="translate(415,90)">
    <rect x="0.5" y="0.5" width="349" height="219" rx="9" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.2"/>
    <circle cx="26" cy="27" r="12" fill="none" stroke="#37474f" stroke-width="1.3"/>
    <text x="26" y="31.5" font-size="13" font-weight="700" fill="#37474f" text-anchor="middle">2</text>
    <text x="48" y="32" font-size="14" font-weight="700" fill="#37474f">Los extremos son nodos</text>
    <rect x="16" y="46" width="318" height="150" rx="6" fill="#fafafa" stroke="#eceff1"/>
    <polyline points="40,100 95,82 150,96 205,84 258,108" fill="none" stroke="#cfd8dc" stroke-width="2.5" stroke-linejoin="round"/>
    <polyline points="40,165 98,176 152,160 206,174 268,154" fill="none" stroke="#cfd8dc" stroke-width="2.5" stroke-linejoin="round"/>
    <g fill="#ffffff" stroke="#37474f" stroke-width="1.6">
      <circle cx="40" cy="100" r="5.5"/><circle cx="95" cy="82" r="5.5"/><circle cx="150" cy="96" r="5.5"/><circle cx="205" cy="84" r="5.5"/><circle cx="258" cy="108" r="5.5"/>
      <circle cx="40" cy="165" r="5.5"/><circle cx="98" cy="176" r="5.5"/><circle cx="152" cy="160" r="5.5"/><circle cx="206" cy="174" r="5.5"/><circle cx="268" cy="154" r="5.5"/>
    </g>
    <text x="175" y="212" font-size="11" font-style="italic" fill="#607d8b" text-anchor="middle">el inicio y el fin de cada tramo se vuelven nodos</text>
  </g>

  <!-- ============ PANEL 3 ============ -->
  <g transform="translate(790,90)">
    <rect x="0.5" y="0.5" width="349" height="219" rx="9" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.2"/>
    <circle cx="26" cy="27" r="12" fill="none" stroke="#37474f" stroke-width="1.3"/>
    <text x="26" y="31.5" font-size="13" font-weight="700" fill="#37474f" text-anchor="middle">3</text>
    <text x="48" y="32" font-size="14" font-weight="700" fill="#37474f">Fusión de nodos cercanos</text>
    <rect x="16" y="46" width="318" height="150" rx="6" fill="#fafafa" stroke="#eceff1"/>
    <line x1="50" y1="118" x2="148" y2="148" stroke="#cfd8dc" stroke-width="2.5"/>
    <line x1="50" y1="182" x2="150" y2="160" stroke="#cfd8dc" stroke-width="2.5"/>
    <circle cx="156" cy="153" r="29" fill="none" stroke="#90a4ae" stroke-width="1.3" stroke-dasharray="4 4"/>
    <circle cx="148" cy="148" r="6" fill="#ffffff" stroke="#37474f" stroke-width="1.6"/>
    <circle cx="160" cy="160" r="6" fill="#ffffff" stroke="#37474f" stroke-width="1.6"/>
    <text x="156" y="112" font-size="11" font-weight="700" fill="#37474f" text-anchor="middle">&#8804; 20 m</text>
    <line x1="198" y1="153" x2="236" y2="153" stroke="#607d8b" stroke-width="1.6" marker-end="url(#mWalk)"/>
    <line x1="258" y1="140" x2="268" y2="150" stroke="#cfd8dc" stroke-width="2.5"/>
    <line x1="258" y1="172" x2="268" y2="158" stroke="#cfd8dc" stroke-width="2.5"/>
    <circle cx="272" cy="154" r="8" fill="#37474f"/>
    <text x="175" y="212" font-size="11" font-style="italic" fill="#607d8b" text-anchor="middle">nodos a ≤ 20 m colapsan en una sola parada</text>
  </g>

  <!-- ============ PANEL 4 — CORREDOR COMPARTIDO ============ -->
  <g transform="translate(40,335)">
    <rect x="0.5" y="0.5" width="349" height="219" rx="9" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.2"/>
    <circle cx="26" cy="27" r="12" fill="none" stroke="#37474f" stroke-width="1.3"/>
    <text x="26" y="31.5" font-size="13" font-weight="700" fill="#37474f" text-anchor="middle">4</text>
    <text x="48" y="32" font-size="14" font-weight="700" fill="#37474f">Corredor compartido por dos líneas</text>
    <rect x="16" y="46" width="318" height="150" rx="6" fill="#fafafa" stroke="#eceff1"/>
    <!-- Línea A: arcos hacia arriba -->
    <path d="M55,150 Q92,121 130,120" fill="none" stroke="#37474f" stroke-width="2.5"/>
    <path d="M130,120 Q167,113 205,135" fill="none" stroke="#37474f" stroke-width="2.5"/>
    <path d="M205,135 Q242,108 280,110" fill="none" stroke="#37474f" stroke-width="2.5"/>
    <!-- Línea B: arcos hacia abajo -->
    <path d="M55,150 Q92,149 130,120" fill="none" stroke="#90a4ae" stroke-width="2.5"/>
    <path d="M130,120 Q167,141 205,135" fill="none" stroke="#90a4ae" stroke-width="2.5"/>
    <path d="M205,135 Q242,136 280,110" fill="none" stroke="#90a4ae" stroke-width="2.5"/>
    <!-- nodos compartidos (mitad A / mitad B) -->
    <g stroke="#37474f" stroke-width="1.4">
      <path d="M55,142 A8,8 0 0,0 55,158 Z" fill="#37474f" stroke="none"/><path d="M55,142 A8,8 0 0,1 55,158 Z" fill="#90a4ae" stroke="none"/><circle cx="55" cy="150" r="8" fill="none"/>
      <path d="M130,112 A8,8 0 0,0 130,128 Z" fill="#37474f" stroke="none"/><path d="M130,112 A8,8 0 0,1 130,128 Z" fill="#90a4ae" stroke="none"/><circle cx="130" cy="120" r="8" fill="none"/>
      <path d="M205,127 A8,8 0 0,0 205,143 Z" fill="#37474f" stroke="none"/><path d="M205,127 A8,8 0 0,1 205,143 Z" fill="#90a4ae" stroke="none"/><circle cx="205" cy="135" r="8" fill="none"/>
      <path d="M280,102 A8,8 0 0,0 280,118 Z" fill="#37474f" stroke="none"/><path d="M280,102 A8,8 0 0,1 280,118 Z" fill="#90a4ae" stroke="none"/><circle cx="280" cy="110" r="8" fill="none"/>
    </g>
    <text x="300" y="95" font-size="10.5" fill="#37474f" text-anchor="end">— Línea A</text>
    <text x="300" y="178" font-size="10.5" fill="#90a4ae" text-anchor="end">— Línea B</text>
    <text x="175" y="212" font-size="11" font-style="italic" fill="#607d8b" text-anchor="middle">comparten los mismos nodos; aristas paralelas, una por línea (sin transbordo)</text>
  </g>

  <!-- ============ PANEL 5 — ARISTAS DE BUS ============ -->
  <g transform="translate(415,335)">
    <rect x="0.5" y="0.5" width="349" height="219" rx="9" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.2"/>
    <circle cx="26" cy="27" r="12" fill="none" stroke="#37474f" stroke-width="1.3"/>
    <text x="26" y="31.5" font-size="13" font-weight="700" fill="#37474f" text-anchor="middle">5</text>
    <text x="48" y="32" font-size="14" font-weight="700" fill="#37474f">Aristas de bus (con peso)</text>
    <rect x="16" y="46" width="318" height="150" rx="6" fill="#fafafa" stroke="#eceff1"/>
    <polyline points="48,152 118,120 192,142 248,150" fill="none" stroke="#37474f" stroke-width="2.8" marker-mid="url(#mArr)"/>
    <line x1="248" y1="150" x2="300" y2="125" stroke="#37474f" stroke-width="2.8" stroke-dasharray="6 4"/>
    <g fill="#ffffff" stroke="#37474f" stroke-width="1.6">
      <circle cx="48" cy="152" r="5.5"/><circle cx="118" cy="120" r="5.5"/><circle cx="192" cy="142" r="5.5"/><circle cx="248" cy="150" r="5.5"/><circle cx="300" cy="125" r="5.5"/>
    </g>
    <text x="150" y="103" font-size="10.5" font-weight="700" fill="#37474f" text-anchor="middle">peso = distancia / velocidad</text>
    <text x="282" y="150" font-size="10" font-style="italic" fill="#607d8b" text-anchor="middle">puente</text>
    <text x="175" y="212" font-size="11" font-style="italic" fill="#607d8b" text-anchor="middle">aristas dirigidas con el tiempo de viaje; los puentes cierran huecos</text>
  </g>

  <!-- ============ PANEL 6 — TRANSBORDOS ============ -->
  <g transform="translate(790,335)">
    <rect x="0.5" y="0.5" width="349" height="219" rx="9" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.2"/>
    <circle cx="26" cy="27" r="12" fill="none" stroke="#37474f" stroke-width="1.3"/>
    <text x="26" y="31.5" font-size="13" font-weight="700" fill="#37474f" text-anchor="middle">6</text>
    <text x="48" y="32" font-size="14" font-weight="700" fill="#37474f">Transbordos a pie</text>
    <rect x="16" y="46" width="318" height="150" rx="6" fill="#fafafa" stroke="#eceff1"/>
    <line x1="55" y1="105" x2="108" y2="118" stroke="#37474f" stroke-width="2.8"/>
    <line x1="216" y1="178" x2="290" y2="190" stroke="#90a4ae" stroke-width="2.8"/>
    <line x1="117" y1="124" x2="207" y2="172" stroke="#607d8b" stroke-width="1.8" stroke-dasharray="5 4" marker-start="url(#mWalk)" marker-end="url(#mWalk)"/>
    <circle cx="110" cy="118" r="6" fill="#ffffff" stroke="#37474f" stroke-width="2"/>
    <circle cx="213" cy="176" r="6" fill="#ffffff" stroke="#90a4ae" stroke-width="2.2"/>
    <g stroke="#607d8b" stroke-width="1.5" fill="none">
      <circle cx="160" cy="133" r="3" fill="#607d8b" stroke="none"/>
      <line x1="160" y1="136" x2="160" y2="146"/>
      <line x1="160" y1="146" x2="155" y2="153"/>
      <line x1="160" y1="146" x2="165" y2="153"/>
      <line x1="154" y1="139" x2="166" y2="139"/>
    </g>
    <text x="212" y="135" font-size="11" font-weight="700" fill="#37474f" text-anchor="middle">&#8804; 400 m</text>
    <text x="175" y="212" font-size="11" font-style="italic" fill="#607d8b" text-anchor="middle">paradas de líneas disjuntas a ≤ 400 m se unen a pie</text>
  </g>

  <!-- ============ PANEL 7 — GRAFO FINAL ============ -->
  <g transform="translate(40,580)">
    <rect x="0.5" y="0.5" width="349" height="219" rx="9" fill="#ffffff" stroke="#37474f" stroke-width="1.4"/>
    <circle cx="26" cy="27" r="12" fill="#37474f"/>
    <text x="26" y="31.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
    <text x="48" y="32" font-size="14" font-weight="700" fill="#37474f">Grafo de transporte final</text>
    <rect x="16" y="46" width="318" height="150" rx="6" fill="#fafafa" stroke="#eceff1"/>
    <!-- Línea A -->
    <polyline points="45,100 108,92 180,128 252,96 305,112" fill="none" stroke="#37474f" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Línea B -->
    <polyline points="48,170 112,178 180,128 250,176 305,160" fill="none" stroke="#90a4ae" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- transbordo -->
    <line x1="305" y1="118" x2="305" y2="154" stroke="#607d8b" stroke-width="1.8" stroke-dasharray="5 4" marker-start="url(#mWalk)" marker-end="url(#mWalk)"/>
    <!-- nodos A -->
    <g fill="#ffffff" stroke="#37474f" stroke-width="1.6">
      <circle cx="45" cy="100" r="5.5"/><circle cx="108" cy="92" r="5.5"/><circle cx="252" cy="96" r="5.5"/><circle cx="305" cy="112" r="5.5"/>
    </g>
    <!-- nodos B -->
    <g fill="#ffffff" stroke="#90a4ae" stroke-width="2">
      <circle cx="48" cy="170" r="5.5"/><circle cx="112" cy="178" r="5.5"/><circle cx="250" cy="176" r="5.5"/><circle cx="305" cy="160" r="5.5"/>
    </g>
    <!-- nodo compartido -->
    <path d="M180,120 A8,8 0 0,0 180,136 Z" fill="#37474f"/><path d="M180,120 A8,8 0 0,1 180,136 Z" fill="#90a4ae"/><circle cx="180" cy="128" r="8" fill="none" stroke="#37474f" stroke-width="1.4"/>
    <text x="175" y="212" font-size="11" font-style="italic" fill="#607d8b" text-anchor="middle">nodos (paradas) + aristas de bus por línea + transbordos a pie</text>
  </g>

  <!-- ============ LEYENDA ============ -->
  <g transform="translate(415,580)">
    <rect x="0.5" y="0.5" width="724" height="219" rx="9" fill="#fcfcfb" stroke="#cfd8dc" stroke-width="1.2"/>
    <text x="28" y="36" font-size="14" font-weight="700" fill="#37474f">Referencias</text>

    <!-- columna 1 -->
    <line x1="30" y1="74" x2="78" y2="74" stroke="#37474f" stroke-width="3"/>
    <text x="92" y="78" font-size="13" fill="#37474f">arista de bus (dirigida)</text>

    <line x1="30" y1="120" x2="78" y2="120" stroke="#37474f" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="92" y="124" font-size="13" fill="#37474f">puente (cierra un hueco)</text>

    <line x1="30" y1="166" x2="78" y2="166" stroke="#607d8b" stroke-width="1.8" stroke-dasharray="5 4" marker-start="url(#mWalk)" marker-end="url(#mWalk)"/>
    <text x="92" y="170" font-size="13" fill="#37474f">transbordo a pie (≤ 400 m)</text>

    <!-- columna 2 -->
    <circle cx="400" cy="74" r="7" fill="#ffffff" stroke="#37474f" stroke-width="1.8"/>
    <text x="418" y="78" font-size="13" fill="#37474f">nodo / parada</text>

    <path d="M400,67 A8,8 0 0,0 400,83 Z" fill="#37474f"/><path d="M400,67 A8,8 0 0,1 400,83 Z" fill="#90a4ae"/><circle cx="400" cy="75" r="8" fill="none" stroke="#37474f" stroke-width="1.4" transform="translate(0,-1)"/>
    <text x="418" y="124" font-size="13" fill="#37474f">nodo compartido (varias líneas)</text>

    <rect x="392" y="161" width="16" height="10" fill="#37474f"/>
    <text x="416" y="170" font-size="13" fill="#37474f">Línea A</text>
    <rect x="500" y="161" width="16" height="10" fill="#90a4ae"/>
    <text x="524" y="170" font-size="13" fill="#37474f">Línea B</text>
  </g>

  <text x="590" y="838" font-size="12.5" font-style="italic" fill="#546e7a" text-anchor="middle">Figura. Construcción del grafo de transporte: de los recorridos de cada línea a nodos (paradas) y aristas (bus y caminata).</text>
</svg>
