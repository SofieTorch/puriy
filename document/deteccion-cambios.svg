<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" font-family="'Latin Modern Roman','Georgia','Times New Roman',serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .title { font-size:17px; font-weight:bold; fill:#1a1a1a; }
      .subt  { font-size:12px; fill:#555; font-style:italic; }
      .mapbox{ fill:#fbfbf9; stroke:#cfcabe; stroke-width:1.3; }
      .cond  { font-size:12.5px; fill:#333; font-weight:bold; }
      .sub   { font-size:11px; fill:#666; font-style:italic; }
      .pill  { font-size:12px; }
      .exist { stroke:#2f6fb0; stroke-width:3; fill:none; stroke-linecap:round; }
      .cand  { stroke:#c8772b; stroke-width:3; fill:none; stroke-linecap:round; stroke-dasharray:7 4; }
    </style>
  </defs>

  <text class="title" text-anchor="middle" x="420" y="26">Detección de cambios por distancia de Fréchet</text>
  <text class="subt" text-anchor="middle" x="420" y="46">umbral de cambio = 50 m (RF-19), evaluado por ramal contra la ruta activa</text>

  <!-- ===== Scenario 1: create v1 ===== -->
  <rect class="mapbox" x="30" y="66" width="240" height="170" rx="8"/>
  <text class="cond" text-anchor="middle" x="150" y="92">no existe ruta activa</text>
  <path class="cand" d="M60,205 L105,170 L150,188 L200,140 L250,160"/>
  <rect x="48" y="252" width="204" height="32" rx="16" fill="#eef2f6" stroke="#7d8794" stroke-width="1.4"/>
  <text class="pill" text-anchor="middle" x="150" y="272" fill="#33414f" font-weight="bold">Crear ruta v1 (PENDIENTE)</text>

  <!-- ===== Scenario 2: unchanged ===== -->
  <rect class="mapbox" x="300" y="66" width="240" height="170" rx="8"/>
  <text class="cond" text-anchor="middle" x="420" y="92">Fréchet &lt; 50 m</text>
  <path class="exist" d="M330,205 L375,170 L420,188 L470,140 L515,160"/>
  <path class="cand" d="M330,210 L375,175 L420,193 L470,145 L515,165"/>
  <text class="sub" text-anchor="middle" x="420" y="230">las geometrías casi coinciden</text>
  <rect x="318" y="252" width="204" height="32" rx="16" fill="#e7f0e8" stroke="#2e8b57" stroke-width="1.4"/>
  <text class="pill" text-anchor="middle" x="420" y="272" fill="#1f6340" font-weight="bold">Sin cambios</text>

  <!-- ===== Scenario 3: supersede ===== -->
  <rect class="mapbox" x="570" y="66" width="240" height="170" rx="8"/>
  <text class="cond" text-anchor="middle" x="690" y="92">Fréchet ≥ 50 m</text>
  <path class="exist" d="M600,200 L645,168 L690,186 L735,140 L778,158"/>
  <path class="cand" d="M600,212 L650,210 L700,222 L745,220 L782,212"/>
  <!-- distance marker -->
  <path d="M700,188 L700,221" stroke="#c0392b" stroke-width="1.3" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="sub" x="708" y="208" fill="#c0392b">d ≥ 50 m</text>
  <rect x="588" y="252" width="204" height="32" rx="16" fill="#f6e6dc" stroke="#c8772b" stroke-width="1.4"/>
  <text class="pill" text-anchor="middle" x="690" y="272" fill="#9c5511" font-weight="bold">Reemplazar + nueva versión</text>

  <!-- ===== legend ===== -->
  <g>
    <line x1="250" y1="332" x2="288" y2="332" stroke="#2f6fb0" stroke-width="3" stroke-linecap="round"/>
    <text class="sub" x="296" y="336">ruta activa existente</text>
    <line x1="460" y1="332" x2="498" y2="332" stroke="#c8772b" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 4"/>
    <text class="sub" x="506" y="336">ruta reconstruida (candidata)</text>
  </g>
</svg>
